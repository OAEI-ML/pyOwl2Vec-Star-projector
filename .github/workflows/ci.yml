name: Java-free CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYOWL2VEC_BUILD_NATIVE: "0"

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OAEI-ML/pyOWLCore
          ref: 21503cf5a35c22c1fa35653c13df958df4fca100
          path: .deps/pyowl-core
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pytest==8.4.2 tomli==2.4.1
      - run: python -m pip install --no-deps -e .deps/pyowl-core
      - run: python -m pip install --no-deps -e .
      - run: python tools/check_core_compatibility.py --core-root .deps/pyowl-core
      - run: python -m pytest -q
      - run: python tools/audit_runtime.py
      - run: python tools/check_baseline.py
      - run: python tools/generate_supply_chain.py --check

  installed-smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OAEI-ML/pyOWLCore
          ref: 21503cf5a35c22c1fa35653c13df958df4fca100
          path: .deps/pyowl-core
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .deps/pyowl-core
      - run: python -m pip install --no-deps .
      - run: python tools/installed_smoke.py
      - run: python -m pip uninstall -y pyowl2vec-star-projector

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OAEI-ML/pyOWLCore
          ref: 21503cf5a35c22c1fa35653c13df958df4fca100
          path: .deps/pyowl-core
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OAEI-ML/OAEI-Bio-ML-eval
          path: .consumers/oaei-bioml-eval
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: liseda-lab/Exact-OM
          path: .consumers/exact-om
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install mypy==1.18.2 ruff==0.14.10 zstandard==0.23.0
      - run: python tools/check_core_compatibility.py --core-root .deps/pyowl-core
        env:
          PYTHONPATH: src:.deps/pyowl-core/src
      - run: python -m ruff check src tests tools benchmarks _build_backend.py setup.py
      - run: python -m ruff format --check src tests tools benchmarks _build_backend.py setup.py
      - run: python -m mypy src
        env:
          MYPYPATH: .deps/pyowl-core/src
      - run: python tools/check_dependency_dag.py --oaei-root .consumers/oaei-bioml-eval
      - run: python tools/compare_exact_baselines.py --exact-root .consumers/exact-om
        env:
          PYTHONPATH: src:.deps/pyowl-core/src
