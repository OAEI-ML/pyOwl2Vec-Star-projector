name: Native backend and wheels

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  core-artifact-resolution:
    name: Core resolver / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: manylinux-x86_64, platform: manylinux_2_28_x86_64, implementation: cp, abi: cp312, expected: cp312-cp312-manylinux_2_28_x86_64.whl}
          - {lane: manylinux-aarch64, platform: manylinux_2_28_aarch64, implementation: cp, abi: cp312, expected: cp312-cp312-manylinux_2_28_aarch64.whl}
          - {lane: macos-x86_64, platform: macosx_13_0_x86_64, implementation: cp, abi: cp312, expected: cp312-cp312-macosx_13_0_x86_64.whl}
          - {lane: macos-arm64, platform: macosx_13_0_arm64, implementation: cp, abi: cp312, expected: cp312-cp312-macosx_13_0_arm64.whl}
          - {lane: windows-x86_64, platform: win_amd64, implementation: cp, abi: cp312, expected: cp312-cp312-win_amd64.whl}
          - {lane: manylinux-2-17-x86_64-fallback, platform: manylinux_2_17_x86_64, implementation: cp, abi: cp312, expected: py3-none-any.whl}
          - {lane: manylinux-2-17-aarch64-fallback, platform: manylinux_2_17_aarch64, implementation: cp, abi: cp312, expected: py3-none-any.whl}
          - {lane: macos-10-12-x86_64-fallback, platform: macosx_10_12_x86_64, implementation: cp, abi: cp312, expected: py3-none-any.whl}
          - {lane: macos-11-arm64-fallback, platform: macosx_11_0_arm64, implementation: cp, abi: cp312, expected: py3-none-any.whl}
          - {lane: musllinux-x86_64-fallback, platform: musllinux_1_2_x86_64, implementation: cp, abi: cp312, expected: py3-none-any.whl}
          - {lane: musllinux-aarch64-fallback, platform: musllinux_1_2_aarch64, implementation: cp, abi: cp312, expected: py3-none-any.whl}
          - {lane: forced-pure-fallback, platform: any, implementation: py, abi: none, expected: py3-none-any.whl}
    steps:
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Resolve exact published core artifact without a source build
        run: >-
          python -m pip download --only-binary=:all: --no-deps
          --dest core-wheel --platform ${{ matrix.platform }}
          --python-version 3.12 --implementation ${{ matrix.implementation }}
          --abi ${{ matrix.abi }} pyowl-core==0.2.0
      - name: Require the target-specific backend policy
        env:
          EXPECTED_SUFFIX: ${{ matrix.expected }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          wheels = tuple(Path("core-wheel").glob("*.whl"))
          assert len(wheels) == 1, wheels
          assert wheels[0].name.endswith(os.environ["EXPECTED_SUFFIX"]), wheels[0]
          PY

  rust-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.83.0"
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --locked --no-default-features

  native-wheel:
    name: Native wheel / ${{ matrix.artifact }}
    needs: core-artifact-resolution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            cibw-arch: x86_64
            core_backend: pure
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
            cibw-arch: aarch64
            core_backend: pure
          - os: macos-15-intel
            artifact: macos-x86_64
            cibw-arch: x86_64
            macos_deployment_target: "10.12"
            core_backend: native
          - os: macos-14
            artifact: macos-arm64
            cibw-arch: arm64
            macos_deployment_target: "11.0"
            core_backend: native
          - os: windows-latest
            artifact: windows-x86_64
            cibw-arch: AMD64
            core_backend: native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OAEI-ML/pyOWLCore
          ref: 422a63363e0b67857eebfca6dd67595ebaad7a09
          path: .deps/pyowl-core
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.83.0"
      - run: python tools/check_core_compatibility.py --core-root .deps/pyowl-core
        env:
          PYTHONPATH: "src${{ runner.os == 'Windows' && ';' || ':' }}.deps/pyowl-core/src"
      - uses: pypa/cibuildwheel@65b8265957fd86372d9689a0acdfd55813970d5d # v3.1.4
        env:
          CIBW_ARCHS: ${{ matrix.cibw-arch }}
          CIBW_BUILD: cp310-*
          CIBW_SKIP: "*-musllinux* *-win32"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: >-
            set -eu;
            rustup_arch="$(uname -m)";
            case "$rustup_arch" in
              x86_64) rustup_sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c ;;
              aarch64) rustup_sha256=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c ;;
              *) echo "unsupported rustup architecture: $rustup_arch" >&2; exit 1 ;;
            esac;
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location
            --output /tmp/rustup-init
            "https://static.rust-lang.org/rustup/archive/1.28.2/$rustup_arch-unknown-linux-gnu/rustup-init";
            echo "$rustup_sha256  /tmp/rustup-init" | sha256sum --check --strict;
            chmod +x /tmp/rustup-init;
            /tmp/rustup-init -y --profile minimal --default-toolchain 1.83.0;
            for tool in cargo rustc rustup; do
              ln -sf "$HOME/.cargo/bin/$tool" "/usr/local/bin/$tool";
            done;
            rm -f /tmp/rustup-init
          CIBW_ENVIRONMENT: >-
            CORE_BACKEND=${{ matrix.core_backend }}
            PYOWL2VEC_BUILD_NATIVE=1
          CIBW_ENVIRONMENT_MACOS: >-
            CORE_BACKEND=${{ matrix.core_backend }}
            PYOWL2VEC_BUILD_NATIVE=1
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}
          CIBW_BEFORE_TEST: >-
            pip install --only-binary=:all: --no-deps pyowl-core==0.2.0
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.util, os;
            found = importlib.util.find_spec('pyowl_core._native') is not None;
            assert found == (os.environ['CORE_BACKEND'] == 'native'),
            (found, os.environ['CORE_BACKEND'])" &&
            python {project}/tools/installed_smoke.py --require-native
      - if: runner.os == 'Linux'
        run: python -m pip install auditwheel==6.4.2 && auditwheel show wheelhouse/*.whl
      - if: runner.os == 'macOS'
        run: python -m pip install delocate==0.13.0 && delocate-listdeps wheelhouse/*.whl
      - if: runner.os == 'Windows'
        run: python -m pip install delvewheel==1.11.2 && delvewheel show wheelhouse/*.whl
      - run: python tools/audit_release.py wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  native-smoke:
    name: Native smoke / ${{ matrix.artifact }} / Python ${{ matrix.python-version }}
    needs: native-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.artifact }}
          path: wheelhouse
      - run: python -m pip install pytest==8.4.2
      - name: Install exact published native core wheel
        run: >-
          python -m pip install --only-binary=:all: --no-deps
          pyowl-core==0.2.0
      - run: python -c "import pyowl_core._native as n; n.self_test()"
      - run: python -m pip install --no-index --no-deps --find-links=wheelhouse pyowl2vec-star-projector==0.2.0
      - run: python tools/installed_smoke.py --require-native
      - run: python -m pytest -q tests/test_native_backend.py tests/test_backend.py
        env:
          PYOWL2VEC_REQUIRE_NATIVE_TESTS: "1"
      - name: P7 installed-wheel encoded contract
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYOWL2VEC_REQUIRE_NATIVE_TESTS: "1"
        run: |
          python -m pytest -q \
            tests/test_native_encoded_foundation.py \
            tests/test_private_native_encoded_integration.py \
            tests/test_encoded_benchmark.py
          python -m tools.differential_encoded_native \
            --cases 32 --provider both --buffer-edges 7 \
            --report "$RUNNER_TEMP/p7-generated-short.json" > /dev/null
          python -m tools.hostile_encoded_native \
            --sources 4 --provider both \
            --report "$RUNNER_TEMP/p7-hostile-short.json" > /dev/null
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p7-native-contract-linux-x86_64-py312
          path: |
            ${{ runner.temp }}/p7-generated-short.json
            ${{ runner.temp }}/p7-hostile-short.json
          if-no-files-found: error

  address-sanitizer:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          toolchain: "nightly-2025-01-15"
          components: rust-src
      - run: cargo test --manifest-path native/Cargo.toml --locked --no-default-features --target x86_64-unknown-linux-gnu
