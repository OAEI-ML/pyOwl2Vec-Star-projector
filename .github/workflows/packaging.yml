name: Fallback packaging

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYOWL2VEC_BUILD_NATIVE: "0"

jobs:
  fallback-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OAEI-ML/pyOWLCore
          ref: b0d8fd27537b2f177cfe9a5e0fd41f33b9f18f19
          path: .deps/pyowl-core
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - run: python -m pip install -r release/fallback-build-requirements.txt
      - run: python tools/check_core_compatibility.py --core-root .deps/pyowl-core
        env:
          PYTHONPATH: src:.deps/pyowl-core/src
      - run: python tools/generate_supply_chain.py --check
      - run: python -m build --sdist --wheel --outdir dist-a
      - run: python -m build --sdist --wheel --outdir dist-b
      - run: python tools/compare_artifacts.py dist-a dist-b
      - run: python tools/audit_release.py dist-a --report release-audit.json
      - run: python tools/hash_artifacts.py dist-a --output dist-a/SHA256SUMS
      - run: python tools/hash_artifacts.py dist-a --verify dist-a/SHA256SUMS
      - run: >-
          python tools/release_gate.py --artifacts dist-a
          --audit-report release-audit.json --report release-gate.json
      - run: python -m build .deps/pyowl-core --wheel --outdir wheelhouse
        env:
          PYOWL_CORE_BUILD_NATIVE: "0"
      - run: python -m pip download --dest wheelhouse setuptools==83.0.0 wheel==0.46.3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fallback-bundle
          path: |
            dist-a/*
            wheelhouse/*
            release-audit.json
            release-gate.json
          if-no-files-found: error

  offline-smoke:
    name: Offline ${{ matrix.artifact }} / Python ${{ matrix.python.version }}
    needs: fallback-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.10"
            image: python:3.10-slim@sha256:e8d6cdadc17ce7146e1bb286e6093d58c8cf582659a558ad51cd103829655e72
          - version: "3.11"
            image: python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045
          - version: "3.12"
            image: python:3.12-slim@sha256:cab2dbf575e971934a81e4622f5aba17aa7929719bd7e31033a3a83b97fd0464
          - version: "3.13"
            image: python:3.13-slim@sha256:afe189875f1d2f9b45e287834fb9f2c273a5d59d354ae4050ab9affbf0a6ba06
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fallback-bundle
          path: fallback-bundle
      - name: Network-disabled compiler-free install
        env:
          PYTHON_IMAGE: ${{ matrix.python.image }}
          ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          docker pull "$PYTHON_IMAGE"
          docker run --rm --network none \
            -e ARTIFACT_KIND="$ARTIFACT_KIND" \
            -e PIP_NO_INDEX=1 \
            -v "$PWD:/source:ro" \
            -v "$PWD/fallback-bundle/dist-a:/dist:ro" \
            -v "$PWD/fallback-bundle/wheelhouse:/wheelhouse:ro" \
            "$PYTHON_IMAGE" sh -eu -c '
              python -m venv /venv
              /venv/bin/python -m pip install --no-index --no-deps /wheelhouse/pyowl_core*.whl
              if [ "$ARTIFACT_KIND" = wheel ]; then
                /venv/bin/python -m pip install --no-index --no-deps /dist/*-py3-none-any.whl
              else
                /venv/bin/python -m pip install --no-index --no-deps --find-links=/wheelhouse /dist/*.tar.gz
              fi
              PATH=/venv/bin /venv/bin/python /source/tools/installed_smoke.py --require-tools-absent
              /venv/bin/python -m pip uninstall -y pyowl2vec-star-projector
              /venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('"'"'pyowl2vec_star_projector'"'"') is None"
            '
