name: Attested release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYOWL2VEC_BUILD_NATIVE: "0"

jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: release-candidate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - run: python -m pip install -r release/fallback-build-requirements.txt
      - run: python tools/generate_supply_chain.py --check
      - run: python -m build --sdist --wheel --outdir dist
      - run: python tools/audit_release.py dist --report dist/release-audit.json
      - run: python tools/hash_artifacts.py dist --output dist/SHA256SUMS
      - run: >-
          python tools/release_gate.py --artifacts dist
          --audit-report dist/release-audit.json --report dist/release-gate.json
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attested-release-artifacts
          path: |
            dist/*
            release/*.json
            release/sbom/*.json
          if-no-files-found: error

# This workflow intentionally has no package-index upload step. Publication is a separate,
# authenticated maintainer action. The owner-authorized local publication path remains separate.
