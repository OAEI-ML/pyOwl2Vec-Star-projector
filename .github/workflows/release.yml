name: Atomic release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the fully staged set to PyPI (run this workflow from a version tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fallback-matrix:
    uses: ./.github/workflows/packaging.yml

  native-matrix:
    uses: ./.github/workflows/native.yml

  final-audit:
    name: Final seven-artifact audit
    needs: [fallback-matrix, native-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fallback-bundle
          path: fallback-bundle

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: native
          merge-multiple: true

      - name: Stage the authoritative artifact set
        run: |
          mkdir artifacts
          cp fallback-bundle/dist-a/*.tar.gz artifacts/
          cp fallback-bundle/dist-a/*-py3-none-any.whl artifacts/
          cp native/*.whl artifacts/
          python - <<'PY'
          from pathlib import Path

          artifacts = sorted(Path("artifacts").iterdir())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          native = [path for path in wheels if not path.name.endswith("-py3-none-any.whl")]
          assert len(artifacts) == 7, artifacts
          assert len(wheels) == 6 and len(sdists) == 1 and len(native) == 5, artifacts
          names = [path.name for path in native]
          required = (
              "manylinux_2_17_x86_64",
              "manylinux_2_17_aarch64",
              "macosx_10_12_x86_64",
              "macosx_11_0_arm64",
              "win_amd64",
          )
          for platform in required:
              matches = [name for name in names if platform in name]
              assert len(matches) == 1, (platform, matches, names)
          PY

      - name: Audit, bind, and gate all staged distributions
        run: |
          python tools/audit_release.py artifacts --report release-audit.json
          python tools/hash_artifacts.py artifacts --output artifacts/SHA256SUMS
          python tools/hash_artifacts.py artifacts --verify artifacts/SHA256SUMS
          python tools/release_gate.py \
            --artifacts artifacts \
            --audit-report release-audit.json \
            --include-external \
            --report release-gate.json

      - name: Require tag and metadata agreement
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/"):
              tag = os.environ["RELEASE_TAG"]
              assert tag == f"v{version}", (tag, version)
          elif os.environ["PUBLISH"] == "true":
              raise AssertionError(f"publication requires a version tag: {ref}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            artifacts/*.whl
            artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: |
            artifacts/SHA256SUMS
            release-audit.json
            release-gate.json
            release/*.json
            release/sbom/*.json
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: Attest the complete distribution set
    needs: final-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release-bundle
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-bundle/*.whl
            release-bundle/*.tar.gz

  publish:
    name: Trusted PyPI publication
    needs: [final-audit, provenance]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release-bundle
      - name: Publish the complete audited set
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release-bundle
          skip-existing: false
          verbose: true
