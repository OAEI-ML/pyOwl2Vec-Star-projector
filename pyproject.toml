[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "pyowl2vec-star-projector"
version = "0.1.1"
description = "Java-free OWL2Vec* projection over shared pyowl-core ontology views"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "native/THIRD_PARTY_LICENSES.md",
]
authors = [{ name = "OAEI-ML contributors" }]
keywords = ["OWL", "ontology", "OWL2Vec", "projection", "semantic-web"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = ["pyowl-core>=0.2,<0.3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
]
native-build = ["setuptools-rust==1.13.0"]

[project.urls]
Documentation = "https://github.com/OAEI-ML/pyOwl2Vec-Star-projector#readme"
Issues = "https://github.com/OAEI-ML/pyOwl2Vec-Star-projector/issues"
Source = "https://github.com/OAEI-ML/pyOwl2Vec-Star-projector"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyowl2vec_star_projector = ["py.typed", "conformance_data/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
