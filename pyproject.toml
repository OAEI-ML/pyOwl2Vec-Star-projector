[build-system]
requires = ["setuptools>=67.6.1", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "pyowl2vec-star-projector"
version = "0.1.0a2"
description = "Java-free OWL2Vec* projection over shared pyowl-core ontology views"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OAEI-ML contributors" }]
keywords = ["OWL", "ontology", "OWL2Vec", "projection", "semantic-web"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Typing :: Typed",
]
dependencies = ["pyowl-core>=0.1,<0.2"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
]

[project.urls]
Documentation = "https://github.com/OAEI-ML/pyOwl2Vec-Star-projector#readme"
Issues = "https://github.com/OAEI-ML/pyOwl2Vec-Star-projector/issues"
Source = "https://github.com/OAEI-ML/pyOwl2Vec-Star-projector"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyowl2vec_star_projector = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
